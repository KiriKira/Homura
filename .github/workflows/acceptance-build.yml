name: Acceptance build (Homura)
on:
  push:
    paths:
      - '.github/workflows/acceptance-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      matrix:
        variant: [normal, relay]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build ${{ matrix.variant }}
        run: |
          set -euo pipefail
          EXTRA="-PrtcEmulator=true -PrtcLabRunner=com.callagent.lab.GatewayJointInstrumentation"
          if [ "${{ matrix.variant }}" = "relay" ]; then EXTRA="$EXTRA -PforceRtcRelay=true"; fi
          ./gradlew $EXTRA :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=2
      - name: Record hashes
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk \
                    app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk | tee sha256.txt
      - name: Verify runner and relay flag
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          $BT/aapt2 dump xmltree --file AndroidManifest.xml app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk | grep -c GatewayJointInstrumentation
      - uses: actions/upload-artifact@v4
        with:
          name: Homura-${{ matrix.variant }}-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            sha256.txt
          if-no-files-found: error

# trigger: force rebuild for joint acceptance APKs
